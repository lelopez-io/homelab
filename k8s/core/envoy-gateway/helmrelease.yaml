---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 1h
  chart:
    spec:
      # The chart bundles the Envoy Gateway CRDs and the full Gateway API
      # set, experimental kinds (TCPRoute, UDPRoute) included.
      chart: gateway-helm
      version: "v1.9.1"
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
