---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 1h
  chart:
    spec:
      # The chart bundles the Envoy Gateway CRDs and the full Gateway API
      # set, experimental kinds (TCPRoute, UDPRoute) included.
      chart: gateway-helm
      version: "v1.9.1"
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      images:
        # The controller image also runs the certgen job and the proxies'
        # shutdown manager. Bump: the chart version and every digest below,
        # steps in k8s/core/pinned-images.md.
        envoyGateway:
          image: docker.io/envoyproxy/gateway:v1.9.1@sha256:0049bcb384c591c6a6dd043fe5c9929ef6e74f230e12dd678d2d3701df9b301e
        envoyProxy:
          image: docker.io/envoyproxy/envoy:distroless-v1.39.1@sha256:eb2c01c13125d1629637cb4e4cce7207009fb7cc2c8027f9742758549d15b6f4
        ratelimit:
          image: docker.io/envoyproxy/ratelimit:8fe6ea42@sha256:a61547259607d40aff153050c2a87873ca1676d1d9f5f06937d412000dcc2df1
