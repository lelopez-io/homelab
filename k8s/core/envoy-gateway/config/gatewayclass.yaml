---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  # Names the stack, so it reads against the nginx IngressClass while both
  # run and routes move over one tier at a time.
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: home-proxy
    namespace: envoy-gateway-system
