---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-https-redirect
  # Same namespace as the Gateway, which the http listener requires by
  # default.
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: home
      sectionName: http
  # The listener sets no hostname, so without this list the route answers
  # any Host and redirects names the tiers do not own.
  hostnames:
    - "*.${SUB_DOMAIN}"
    - "*.${VIA_DOMAIN}"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
