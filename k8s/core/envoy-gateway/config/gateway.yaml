---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: home
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      # Redirect only, in httproute-redirect.yaml.
    - name: https-sub
      port: 443
      protocol: HTTPS
      # Both https listeners share a port, so the hostname pin is what
      # keeps them distinct; it also selects the tier certificate by SNI.
      hostname: "*.${SUB_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: sub-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.lan/routes: "true"
    - name: factorio
      # LAN game lane, moved off the nginx udp stream map.
      port: 34197
      protocol: UDP
      allowedRoutes:
        kinds:
          - kind: UDPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.lan/routes: "true"
    - name: minecraft
      # LAN game lane, moved off the nginx tcp stream map.
      port: 25565
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.lan/routes: "true"
    - name: git-ssh
      # The forge's git lane. Raw TCP, so ssh keeps its own crypto and the
      # gateway only carries bytes; sharing this address is what lets the
      # wildcard resolve the forge's one hostname for both web and git.
      port: 22
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.lan/routes: "true"
    - name: forge-tailnet-https
      # The forge's tailnet web lane: the annotated Service maps svc:forge's
      # 443 here. The hostname pin keeps the lane serving the forge alone
      # whatever name a client sends, on the tier cert it already presents.
      port: 8443
      protocol: HTTPS
      hostname: "${FORGE_HOST}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: sub-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.lan/routes: "true"
    - name: forge-tailnet-ssh
      # The forge's tailnet git lane: svc:forge maps its 22 here. Raw TCP
      # like git-ssh, so ssh keeps its own crypto end to end.
      port: 2222
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.lan/routes: "true"
    - name: minecraft-bedrock
      # LAN game lane, moved off the nginx udp stream map.
      port: 19132
      protocol: UDP
      allowedRoutes:
        kinds:
          - kind: UDPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.lan/routes: "true"
    - name: palworld
      port: 8211
      protocol: UDP
      allowedRoutes:
        kinds:
          - kind: UDPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.lan/routes: "true"
    - name: https-via
      port: 443
      protocol: HTTPS
      hostname: "*.${VIA_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: via-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.lan/routes: "true"
    - name: https-dev
      # The dev tier, on the tunnel lane the via tier rides. Forge runs
      # attach their own app's route here and nowhere else, so it admits
      # namespaces by the forge/repository label rather than by
      # gateway.lan/routes, which the forge grant forbids a run to set.
      port: 443
      protocol: HTTPS
      hostname: "*.${DEV_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: dev-wildcard-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: forge/repository
                operator: Exists
