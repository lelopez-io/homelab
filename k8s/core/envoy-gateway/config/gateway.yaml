---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: home
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      # Redirect only, in httproute-redirect.yaml.
    - name: https-sub
      port: 443
      protocol: HTTPS
      # Both https listeners share a port, so the hostname pin is what
      # keeps them distinct; it also selects the tier certificate by SNI.
      hostname: "*.${SUB_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: sub-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.lan/routes: "true"
    - name: https-via
      port: 443
      protocol: HTTPS
      hostname: "*.${VIA_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: via-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.lan/routes: "true"
