---
# The edge reads each client's address and writes it as a PROXY header at
# the start of the connection; the tunnel relays those bytes untouched. A
# forwarding header the client sent is dropped first, so apps that trust
# its first entry see the real address and nothing a client chose.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: tunnel-tiers
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: home
      sectionName: https-via
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: home
      sectionName: https-dev
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: home
      sectionName: https-client
  # Optional until the edge sends the header on every connection.
  proxyProtocol:
    optional: true
  headers:
    earlyRequestHeaders:
      remove:
        - X-Forwarded-For
