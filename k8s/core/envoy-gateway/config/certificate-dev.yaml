---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dev-wildcard
  # Issued where it terminates, like via-wildcard, and not mirrored out.
  namespace: envoy-gateway-system
spec:
  secretName: dev-wildcard-tls
  dnsNames:
    # Same Flux substitution and quoting as sub-wildcard's dnsNames.
    - "*.${DEV_DOMAIN}"
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
