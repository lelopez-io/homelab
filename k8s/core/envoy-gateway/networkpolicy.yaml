---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Kubernetes API for the controller, reached at the control plane node
    # IPs after kube-proxy rewrites the kubernetes Service address.
    - to:
        - ipBlock:
            cidr: 192.168.10.30/32
        - ipBlock:
            cidr: 192.168.10.31/32
        - ipBlock:
            cidr: 192.168.10.32/32
      ports:
        - protocol: TCP
          port: 6443
    # The whole pod network: the proxies' xDS channel to the controller
    # now, route backends once tiers move. A Service or MetalLB IP never
    # matches an egress rule because kube-proxy rewrites to the backend
    # pod before kube-router evaluates the packet.
    - to:
        - ipBlock:
            cidr: 10.244.0.0/16
