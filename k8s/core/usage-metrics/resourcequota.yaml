---
# Each updates without a surge pod, so a quarter more covers a resize. Limits
# are capped too: both set one.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: usage-metrics
spec:
  hard:
    requests.cpu: "250m"
    requests.memory: 512Mi
    limits.memory: 1Gi
    pods: "4"
