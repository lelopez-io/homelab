---
# Limits are capped because every container sets one. A chart bump rolls the
# deployments at once, one surge pod each, so the quota is twice the total.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: cert-manager
spec:
  hard:
    requests.cpu: "250m"
    requests.memory: 512Mi
    limits.cpu: "1500m"
    limits.memory: 1536Mi
    pods: "8"
