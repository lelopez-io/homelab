---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./k8s/core/kyverno
  prune: true
  # Policies depend on this one, and its CRDs arrive with the chart, so
  # wait until the release is healthy before anything of its kinds applies.
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
