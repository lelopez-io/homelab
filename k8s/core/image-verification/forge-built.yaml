---
# Forge builds are signed with a cosign key, the kyverno Secret forge-build-key,
# created outside this repo. The forge's OIDC issuer is not one public Fulcio
# accepts, so there is no keyless identity; the build pushes <digest>.sig.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-forge-built-images
  annotations:
    # Autogen is off: rewriting a controller's pod template would fight Flux.
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: false
  webhookConfiguration:
    # Fail: Ignore would lift every rule while Kyverno is down. The skipped
    # namespaces keep an outage from blocking the restart of Kyverno, Flux or
    # the cluster's DNS.
    failurePolicy: Fail
    timeoutSeconds: 30
    matchConditions:
      - name: skip-platform-namespaces
        expression: "!(request.namespace in ['kube-system', 'kyverno', 'flux-system'])"
  rules:
    - name: forge-built
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kyverno, flux-system]
      verifyImages:
        - imageReferences: ["${FORGE_HOST}/*"]
          failureAction: Audit
          mutateDigest: false
          required: true
          attestors:
            - entries:
                - keys:
                    secret:
                      name: forge-build-key
                      namespace: kyverno
