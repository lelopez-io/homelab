---
# Forge builds are signed with a cosign key held as the Secret below. The
# forge's OIDC issuer is not one public Fulcio accepts, so there is no keyless
# identity; the build must push the signature as the <digest>.sig tag.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-forge-built-images
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 30
    matchConditions:
      - name: skip-platform-namespaces
        expression: "!(request.namespace in ['kube-system', 'kyverno', 'flux-system'])"
  rules:
    - name: forge-built
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kyverno, flux-system]
      verifyImages:
        - imageReferences: ["${FORGE_HOST}/*"]
          failureAction: Audit
          mutateDigest: false
          required: true
          attestors:
            - entries:
                - keys:
                    secret:
                      name: forge-build-key
                      namespace: kyverno
