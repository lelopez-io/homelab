---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kyverno
  namespace: kyverno
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Kubernetes API, reached at the control plane node IPs after
    # kube-proxy rewrites the kubernetes Service address.
    - to:
        - ipBlock:
            cidr: 192.168.10.30/32
        - ipBlock:
            cidr: 192.168.10.31/32
        - ipBlock:
            cidr: 192.168.10.32/32
      ports:
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kyverno-webhook
  namespace: kyverno
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: admission-controller
  policyTypes:
    - Ingress
  ingress:
    # The API server calls the admission webhook (9443) from a node, and
    # the Service picks a pod on any node: a cross-node call arrives from
    # the caller's flannel address, a same-node call passes by itself.
    - from:
        - ipBlock:
            cidr: 192.168.10.30/32
        - ipBlock:
            cidr: 192.168.10.31/32
        - ipBlock:
            cidr: 192.168.10.32/32
        - ipBlock:
            cidr: 10.244.0.0/32
        - ipBlock:
            cidr: 10.244.1.0/32
        - ipBlock:
            cidr: 10.244.2.0/32
      ports:
        - protocol: TCP
          port: 9443
