---
# 4 pods, 300m and 448Mi requested, 1500m and 1408Mi limited; a chart bump
# surges one pod of each of the 3 deployments, so two thirds more.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: kyverno
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "3"
    limits.memory: 3Gi
    pods: "10"
