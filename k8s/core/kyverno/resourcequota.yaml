---
# Limits are capped because every container sets one. A chart bump surges one
# pod of each deployment, so two thirds more than the running total.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: kyverno
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "3"
    limits.memory: 3Gi
    pods: "10"
