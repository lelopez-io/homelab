---
# 3 plugin pods, 30m and 384Mi requested; a daemonset replaces one node at a
# time, so the room is for three new nodes at 128Mi each.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: intel-gpu-resource-driver
spec:
  hard:
    requests.cpu: "100m"
    requests.memory: 1Gi
    pods: "6"
