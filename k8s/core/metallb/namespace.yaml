---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    # The speaker needs host networking and host ports for L2 announcement;
    # no pod here runs a privileged container.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

