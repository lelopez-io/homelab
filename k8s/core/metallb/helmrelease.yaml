---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # L2-only here (no BGPPeers), so the frr-k8s BGP backend stays off.
    frrk8s:
      enabled: false
    # No CPU limit: throttling delays an announcement.
    controller:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
      # The chart joins repository and tag, so each tag carries its digest.
      # Bump: the chart version and each image tag with its digest, steps in
      # k8s/core/pinned-images.md.
      image:
        tag: v0.16.1@sha256:f51ab515de9ccd20dc3dccb093e48df8adddac019326c456f449e55ba91b6420
      securityContext:
        # The speaker shares this namespace and needs host networking, so the
        # namespace label stays privileged and constrains nothing here.
        seccompProfile:
          type: RuntimeDefault
    speaker:
      # A killed speaker stops answering for its node's addresses until it
      # returns.
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 256Mi}
      image:
        tag: v0.16.1@sha256:16561e96531e1852d5c229ad7fae6e994dcfa983ff7f4de6b6208b34a4e2ddbc
      ignoreExcludeLB: true
