---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # L2-only here (no BGPPeers), so the frr-k8s BGP backend stays off.
    frrk8s:
      enabled: false
    # Limits are 3 to 4 times the idle working sets (31Mi, 77Mi), an
    # estimate; no CPU limit, as throttling delays an announcement. A killed
    # speaker stops answering for its node's addresses until it returns.
    controller:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
      securityContext:
        # The speaker shares this namespace and needs host networking, so the
        # namespace label stays privileged and constrains nothing here.
        seccompProfile:
          type: RuntimeDefault
    speaker:
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 256Mi}
      ignoreExcludeLB: true
