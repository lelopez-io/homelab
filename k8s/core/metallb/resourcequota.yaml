---
# 3 speakers and a controller, 40m and 128Mi requested after defaults; the
# controller surges one pod. The speakers are on the host network.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: metallb-system
spec:
  hard:
    requests.cpu: "250m"
    requests.memory: 512Mi
    pods: "10"
