---
# 6 pods, 60m and 384Mi requested; the operator adds a proxy pod per exposed
# service, so room for six more at 64Mi each, and one operator surge.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: tailscale
spec:
  hard:
    requests.cpu: "250m"
    requests.memory: 1Gi
    pods: "14"
