---
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: homelab-subnet
spec:
  replicas: 3
  proxyClass: control-plane
  hostnamePrefix: homelab-subnet
  subnetRouter:
    advertiseRoutes:
      - "192.168.10.0/24"
      # The NAS alone, so a grant can admit a device to its file sharing
      # without the rest of the storage VLAN.
      - "${NAS_ADDRESS}/32"
