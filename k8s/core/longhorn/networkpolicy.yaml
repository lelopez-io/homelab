---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    - to:
        - ipBlock:
            cidr: 192.168.10.30/32
        - ipBlock:
            cidr: 192.168.10.31/32
        - ipBlock:
            cidr: 192.168.10.32/32
      ports:
        - protocol: TCP
          port: 6443
    - to:
        - ipBlock:
            cidr: 192.168.10.0/24
    # Longhorn's control plane: the CSI plugin reaches longhorn-backend, which
    # kube-proxy rewrites to a manager pod before kube-router evaluates egress.
    # Without the pod network here, no Longhorn volume can mount.
    - to:
        - ipBlock:
            cidr: 10.244.0.0/16
