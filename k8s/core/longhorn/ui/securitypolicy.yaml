---
# Envoy Gateway reads users from the ".htpasswd" key and verifies SHA-1
# lines only (htpasswd -s). A hash that drifts from the stored password
# surfaces as a 401 re-prompt loop, so regenerate the line, never hand-edit.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: longhorn-ui
  basicAuth:
    users:
      name: longhorn-basic-auth
