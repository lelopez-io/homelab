---
# The gateway's proxies enforce basic auth on the UI route, then forward to
# the pod's http port (8000): kube-proxy rewrites the service before the
# packet reaches the policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-ui-frontend
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: home
      ports:
        - protocol: TCP
          port: 8000
