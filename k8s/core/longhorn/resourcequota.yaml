---
# An engine upgrade runs a second set of instance managers beside the first,
# and adds engine images, CSI surge and share managers. Instance managers
# reserve CPU by guaranteed-instance-manager-cpu; raise the two together.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: longhorn-system
spec:
  hard:
    requests.cpu: "13"
    requests.memory: 4Gi
    pods: "64"
