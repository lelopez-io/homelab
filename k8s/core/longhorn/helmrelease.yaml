---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # The chart has no resources value for the UI, the driver deployer, the
  # manager's pre-pull container or the upgrade hook jobs. Sizes come from
  # the kubelet's working set and average CPU over about 40 idle hours.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: longhorn-ui
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: longhorn-ui
              spec:
                template:
                  spec:
                    containers:
                      - name: longhorn-ui
                        resources:
                          requests: {cpu: 10m, memory: 32Mi}
          - target:
              kind: Deployment
              name: longhorn-driver-deployer
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: longhorn-driver-deployer
              spec:
                template:
                  spec:
                    initContainers:
                      - name: wait-longhorn-manager
                        resources:
                          requests: {cpu: 1m, memory: 8Mi}
                          limits: {memory: 32Mi}
                    containers:
                      - name: longhorn-driver-deployer
                        resources:
                          requests: {cpu: 10m, memory: 32Mi}
          - target:
              kind: DaemonSet
              name: longhorn-manager
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: longhorn-manager
              spec:
                template:
                  spec:
                    containers:
                      - name: pre-pull-share-manager-image
                        resources:
                          requests: {cpu: 1m, memory: 8Mi}
          # Not measured: they run once per chart bump, and no limit yet.
          - target:
              kind: Job
              name: longhorn-(pre|post)-upgrade
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests: {cpu: 50m, memory: 64Mi}
  values:
    # The chart joins repository and tag, so each tag carries its digest. A new
    # engine image string is a new engine image to Longhorn, which volumes move
    # to by an upgrade. Bump and steps: k8s/core/pinned-images.md.
    image:
      longhorn:
        engine:
          tag: v1.12.1@sha256:9b1b720b56df6612c9589cbc156acbca6419fa61de818d05db7226b0722f2868
        manager:
          tag: v1.12.1@sha256:83b79f57043fe1405e68bc0d4c7987accbc6bb512def3e0db12b31966c070801
        ui:
          tag: v1.12.1@sha256:03a3ce6673df6e948c261fe978a695adaa8fb190d68bfe5c358af8ee3d3fbef5
        instanceManager:
          tag: v1.12.1@sha256:b255f3279dd9d830ea153e9369928646dee519fd853036388926dddb5c66094b
        shareManager:
          tag: v1.12.1@sha256:efaf47aeb4e8615e312f0880df860bf2e5b9fa53006fe075f057c6dd4089f47d
        backingImageManager:
          tag: v1.12.1@sha256:dfb9452e4190fb80e39c7976a0036ac0ca314c05328b67952f8c165cbb4dabf3
        supportBundleKit:
          tag: v0.0.92@sha256:02baa824d9a4174747ab9db2635ae000b1198d2d5ed3a4c69caf28724224e783
      csi:
        attacher:
          tag: v4.12.0@sha256:a814aa4784197116983ea13e376fc691e000a390de9d0b9fca2bc4a2fb7c4a1f
        provisioner:
          tag: v5.3.0@sha256:1bbb7b11d8087130e722e3249f364d0ab49ee3545e847c2f299e87b7e1ce5c4f
        nodeDriverRegistrar:
          tag: v2.17.0@sha256:29f7cfd519008fe8f8dff5e79db43f70d65c43a89c08f1bafbb199ca90df79f0
        resizer:
          tag: v2.2.1@sha256:63d0aef25114d4a682b25afa6d9623a3cfcc19aca910269124408476bbe2c6fd
        snapshotter:
          tag: v8.6.0@sha256:2bca9ac55170efa61dc50e5cc8d9550373db2e3e5161d82d3fdaac5c25150360
        livenessProbe:
          tag: v2.19.0@sha256:d0cb76b565ba9d36da0dc2b38e2b6a49a0ae4fe067b03086110682f32c600318
    # 1.12 turns six ingress policies on by default, and a confirmed
    # priority-zero defect in them blocks volume attach: the engine logs
    # into its own target from the host namespace, which they do not admit.
    # Off until the patch that fixes it ships, which leaves this exactly
    # where the previous version stood rather than opting into a known break.
    networkPolicies:
      restrictInternalTraffic: false
    defaultSettings:
      # Start with 2 replicas (we have 2 nodes, will add 3rd)
      defaultReplicaCount: 2
      # Sidecars hold a Kubernetes informer; the largest working set seen
      # was 59Mi, and a kill delays provisioning or attach until it returns.
      systemManagedCSIComponentsResourceLimits: >-
        {"csi-attacher": {"requests": {"cpu": "10m", "memory": "64Mi"}, "limits": {"memory": "256Mi"}},
         "csi-provisioner": {"requests": {"cpu": "10m", "memory": "64Mi"}, "limits": {"memory": "256Mi"}},
         "csi-resizer": {"requests": {"cpu": "10m", "memory": "64Mi"}, "limits": {"memory": "256Mi"}},
         "csi-snapshotter": {"requests": {"cpu": "10m", "memory": "64Mi"}, "limits": {"memory": "256Mi"}},
         "longhorn-csi-plugin": {"requests": {"cpu": "10m", "memory": "96Mi"}},
         "node-driver-registrar": {"requests": {"cpu": "5m", "memory": "32Mi"}, "limits": {"memory": "128Mi"}},
         "longhorn-liveness-probe": {"requests": {"cpu": "5m", "memory": "32Mi"}, "limits": {"memory": "128Mi"}}}
    persistence:
      # Retain volumes when PVC deleted (safer, manual cleanup)
      reclaimPolicy: Retain
      defaultClassReplicaCount: 2
    # Make Longhorn the default StorageClass
    defaultClass: true
    # Requests only: the manager's working set was 142 to 719Mi over 40 idle
    # hours, too wide to cap from an idle sample. No CPU limit: throttling
    # delays an attach. See the budgets doc.
    longhornManager:
      resources:
        requests: {cpu: 50m, memory: 256Mi}
