    - {name: a, image: "registry.example/a:1@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}
  initContainers:
    - {name: i, image: "registry.example/i@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-tag, namespace: app}
spec:
  containers:
    - {name: a, image: "registry.example/a:1"}
---
apiVersion: v1
