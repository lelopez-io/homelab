---
apiVersion: v1
kind: Pod
metadata: {name: ok-plain, namespace: app}
spec:
  containers:
    - {name: a, image: x, ports: [{containerPort: 80}]}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-hostnet, namespace: app}
spec:
  hostNetwork: true
  containers:
    - {name: a, image: x}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-hostport, namespace: app}
spec:
  containers:
    - {name: a, image: x, ports: [{containerPort: 80, hostPort: 80}]}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-hostpath, namespace: app}
spec:
  containers:
    - {name: a, image: x}
  volumes:
    - {name: v, hostPath: {path: /dev/dri}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: bad-ds, namespace: app}
spec:
  template:
    spec:
      containers:
        - {name: a, image: x}
      volumes:
        - {name: v, hostPath: {path: /run}}
---
apiVersion: v1
kind: Pod
metadata: {name: ok-plex-dri, namespace: plex}
spec:
  containers:
    - {name: a, image: x}
  volumes:
    - {name: v, hostPath: {path: /dev/dri}}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-plex-otherpath, namespace: plex}
spec:
  containers:
    - {name: a, image: x}
  volumes:
    - {name: v, hostPath: {path: /dev/dri/card0}}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-plex-hostnet, namespace: plex}
spec:
  hostNetwork: true
  containers:
    - {name: a, image: x}
  volumes:
    - {name: v, hostPath: {path: /dev/dri}}
