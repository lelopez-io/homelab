---
# Only Flux may lower a namespace's pod security level: by a lower value, by
# removing the label, or by creating the namespace below restricted, which a
# delete and recreate would do. defaults mirrors talos/talconfig.yaml.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-labels
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: not-flux
      expression: "request.userInfo.username != 'system:serviceaccount:flux-system:kustomize-controller'"
  variables:
    - name: ranks
      expression: "{'privileged': 0, 'baseline': 1, 'restricted': 2}"
    - name: defaults
      expression: "{'enforce': 'restricted', 'audit': 'restricted', 'warn': 'restricted'}"
    - name: old
      expression: "request.operation == 'UPDATE' ? oldObject.metadata.?labels.orValue({}) : {}"
    - name: new
      expression: "object.metadata.?labels.orValue({})"
  validations:
    - expression: >-
        request.operation != 'UPDATE' || variables.defaults.all(m,
          variables.ranks[?variables.new[?'pod-security.kubernetes.io/' + m].orValue(variables.defaults[m])].orValue(0) >=
          variables.ranks[?variables.old[?'pod-security.kubernetes.io/' + m].orValue(variables.defaults[m])].orValue(0))
      message: "only Flux may lower a namespace's pod security enforce, audit or warn level"
    - expression: >-
        request.operation != 'CREATE' || variables.defaults.all(m,
          variables.ranks[?variables.new[?'pod-security.kubernetes.io/' + m].orValue(variables.defaults[m])].orValue(0) >= 2)
      message: "only Flux may create a namespace with a pod security level below restricted"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-security-labels
spec:
  policyName: pod-security-labels
  validationActions: ["Deny"]
