---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-router
  annotations:
    # The policy check reads this: it passes a namespace without a
    # NetworkPolicy only when it names the reason and every pod in it uses
    # the host network.
    platform.example/netpol-exempt: the daemonset runs on the host network, which policy never filters
  labels:
    # The CNI needs host namespaces, host paths and a privileged container.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  # No NetworkPolicy: the daemonset runs on the host network, which policy
  # never filters, so a rule here would claim an isolation it cannot give.
  # No quota either: a refused pod leaves a node with no pod network.
