# Sets the field only where a pod leaves it unset; an explicit true stays, so
# the admission policy sees the request as written. With Kyverno down the pod
# arrives unmutated and that policy refuses it: an outage never lifts the rule.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: forge-pod-tokens
spec:
  failurePolicy: Ignore
  reinvocationPolicy: Never
  matchConditions:
    - name: field-unset
      expression: "!has(object.spec.automountServiceAccountToken)"
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: forge/repository
          operator: Exists
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{automountServiceAccountToken: false}}
