---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubelet-csr-approver
  namespace: kubelet-csr-approver
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # Nothing connects in. The kubelet's probes come from the pod's own node,
  # which kube-router accepts, and nothing scrapes the metrics port.
  ingress: []
  egress:
    # The API server, on the control plane nodes' own addresses: kube-proxy
    # rewrites the Service address to these before the policy is evaluated.
    - to:
        - ipBlock:
            cidr: 192.168.10.30/32
        - ipBlock:
            cidr: 192.168.10.31/32
        - ipBlock:
            cidr: 192.168.10.32/32
      ports:
        - protocol: TCP
          port: 6443
