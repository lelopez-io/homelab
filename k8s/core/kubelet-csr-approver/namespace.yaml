---
apiVersion: v1
kind: Namespace
metadata:
  name: kubelet-csr-approver
  labels:
    # The approver is a non-root, seccomped, capability-free controller that
    # signs node identities, so the namespace refuses anything weaker.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
