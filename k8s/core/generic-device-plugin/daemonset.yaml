---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: generic-device-plugin
  labels:
    app.kubernetes.io/name: generic-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      priorityClassName: system-node-critical
      # The plugin speaks to the kubelet over its socket only.
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: generic-device-plugin
          image: docker.io/squat/generic-device-plugin:7626d56@sha256:11fa77056eb09661c08ab9760778eec7fded67b0119fff2536b064b28d1211c1
          imagePullPolicy: IfNotPresent
          args:
            - --device
            - |
              name: tun
              groups:
                # Each open of a tun node yields a fresh interface, so one
                # device serves many pods; count only caps claimants.
                - count: 10
                  paths:
                    # The plugin's default adds mknod, which a pod must not get.
                    - path: /dev/net/tun
                      permissions: rw
            # Health and metrics answer on loopback; nothing scrapes them.
            - --listen=127.0.0.1:8080
          resources:
            requests:
              cpu: 50m
              memory: 10Mi
            limits:
              cpu: 50m
              memory: 20Mi
          securityContext:
            # Root, because the kubelet's socket directory is root-owned.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev-net
              mountPath: /dev/net
              readOnly: true
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev-net
          hostPath:
            path: /dev/net
