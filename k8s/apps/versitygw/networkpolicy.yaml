---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: versitygw
  namespace: versitygw
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
