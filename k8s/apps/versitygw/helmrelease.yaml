---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: versitygw
  namespace: versitygw
spec:
  type: oci
  interval: 24h
  url: oci://ghcr.io/versity/versitygw/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: versitygw
  namespace: versitygw
spec:
  interval: 30m
  chart:
    spec:
      chart: versitygw
      version: "0.4.4"
      sourceRef:
        kind: HelmRepository
        name: versitygw
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Conditional writes, which are the whole reason this gateway was
    # chosen, are coordinated by an advisory lock held through one kernel
    # on one mount. A second instance would not see the first one's locks,
    # which is the failure those writes exist to prevent.
    replicaCount: 1
    strategy:
      type: Recreate

    image:
      repository: ghcr.io/versity/versitygw
      tag: "v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499"

    auth:
      existingSecret: versitygw-root

    gateway:
      backend:
        type: posix
        args: "/mnt/data"
      port: 7070
      region: us-east-1

    persistence:
      enabled: true
      create: false
      claimName: versitygw-data
      accessMode: ReadWriteOnce

    service:
      type: ClusterIP

    # Consumers are in-cluster, so nothing is published. Adding a route
    # later is a route, not a redesign.
    ingress:
      enabled: false

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 1Gi
