---
# Limits are capped because every container sets one. Recreate never holds two
# pods, so a quarter more covers a resize.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: versitygw
spec:
  hard:
    requests.cpu: "100m"
    requests.memory: 256Mi
    limits.cpu: "1500m"
    limits.memory: 1536Mi
    pods: "3"
