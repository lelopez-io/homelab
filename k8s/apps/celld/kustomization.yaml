---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret-bucket.sops.yaml
  - statefulset.yaml
  - service.yaml
  - networkpolicy.yaml
  - cronjob-torn-scan.yaml
configMapGenerator:
  - name: torn-scan
    files:
      - torn-scan.sh
# No name hash: kustomize does not rewrite a configMap reference inside a
# CronJob job template, so a suffixed name would leave the mount dangling.
generatorOptions:
  disableNameSuffixHash: true
