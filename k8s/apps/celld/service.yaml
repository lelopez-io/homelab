---
apiVersion: v1
kind: Service
metadata:
  name: celld-peer
  namespace: celld
  labels:
    app.kubernetes.io/name: celld
spec:
  # Headless: a pod's name under this service resolves to the pod itself,
  # which is the address peers replicate to.
  clusterIP: None
  selector:
    app.kubernetes.io/name: celld
  ports:
    - name: internal
      port: 8081
      targetPort: internal
---
apiVersion: v1
kind: Service
metadata:
  name: celld
  namespace: celld
  labels:
    app.kubernetes.io/name: celld
spec:
  selector:
    app.kubernetes.io/name: celld
  ports:
    - name: app
      port: 8080
      targetPort: app
