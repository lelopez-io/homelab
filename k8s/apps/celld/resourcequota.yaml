---
# 3 replicas, 300m and 768Mi requested, 3 and 6Gi limited; a stateful set
# replaces one pod at a time, so a quarter more covers a resize.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: celld
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "5"
