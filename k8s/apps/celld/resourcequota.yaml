---
# Limits are capped because every container sets one. A stateful set replaces
# one pod at a time, so a quarter more covers a resize.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: celld
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "5"
