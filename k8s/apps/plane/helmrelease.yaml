---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: plane
  namespace: plane
spec:
  interval: 24h
  url: https://helm.plane.so
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plane
  namespace: plane
spec:
  interval: 30m
  chart:
    spec:
      chart: plane-ce
      version: "1.8.5"
      sourceRef:
        kind: HelmRepository
        name: plane
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # The hostname and credentials come from the sops secret, since the repo
  # is public and the domain is not. A comma in any value would wedge the
  # release, so the generated passwords are hex.
  valuesFrom:
    - kind: Secret
      name: plane-secrets
      valuesKey: host
      targetPath: ingress.appHost
    # SECRET_KEY also encrypts stored instance settings such as SMTP and
    # OAuth credentials, so rotating it loses them without an error.
    - kind: Secret
      name: plane-secrets
      valuesKey: secret-key
      targetPath: env.secret_key
    - kind: Secret
      name: plane-secrets
      valuesKey: live-server-secret-key
      targetPath: env.live_server_secret_key
    - kind: Secret
      name: plane-secrets
      valuesKey: pgdb-password
      targetPath: env.pgdb_password
    - kind: Secret
      name: plane-secrets
      valuesKey: rabbitmq-password
      targetPath: rabbitmq.default_password
    - kind: Secret
      name: plane-secrets
      valuesKey: minio-password
      targetPath: minio.root_password
  values:
    planeVersion: v1.4.2

    # An HTTPRoute on the gateway serves this instead, which also turns off
    # the chart's certificates and traefik objects. The gateway terminates
    # TLS, and this setting is what makes the app build https links.
    ingress:
      enabled: false
    ssl:
      externalTermination: true

    env:
      # Fail the render rather than fall back to the chart's published
      # example keys if the secret ever loses one.
      requireExplicitSecrets: true
      pgdb_username: plane
      pgdb_name: plane
      docstore_bucket: uploads

    # The datastores run in the namespace from their public images. Each
    # volume is on the encrypted class, so the daily backup covers it.
    postgres:
      image: postgres:15.7-alpine@sha256:468d34fefd6338031787c7b8e94078975b3aaf4d66c7ead25c39cd3ba46a15c6
      storageClass: longhorn-encrypted
      volumeSize: 5Gi
    redis:
      image: valkey/valkey:7.2.11-alpine@sha256:10328d00120dc14fbc87b2ed61b7677ddbb0d011e705361b4788329a0ec69a93
      storageClass: longhorn-encrypted
      volumeSize: 1Gi
    rabbitmq:
      image: rabbitmq:3.13.6-management-alpine@sha256:611107e29cce05c2acd968325d5dcbde7e2fee404970f1ead75fdb22be2821b3
      storageClass: longhorn-encrypted
      volumeSize: 1Gi
      default_user: plane
    # The chart's bundled object store. Moving to versitygw later is an
    # endpoint, a credential and a bucket sync.
    minio:
      image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
      root_user: plane
      storageClass: longhorn-encrypted
      volumeSize: 10Gi
      assign_cluster_ip: true

    # The app images are pinned by digest below, so pulling on every start
    # fetches nothing new. The chart makes every Service headless; the ones
    # the gateway routes to get a cluster IP.
    web:
      pullPolicy: IfNotPresent
      assign_cluster_ip: true
    space:
      pullPolicy: IfNotPresent
      assign_cluster_ip: true
    admin:
      pullPolicy: IfNotPresent
      assign_cluster_ip: true
    live:
      pullPolicy: IfNotPresent
      assign_cluster_ip: true
    api:
      pullPolicy: IfNotPresent
      assign_cluster_ip: true
    worker:
      pullPolicy: IfNotPresent
    beatworker:
      pullPolicy: IfNotPresent

  # The chart sets no security context and no image runs as a named user,
  # so these patches are what admit its pods under restricted.
  postRenderers:
    - kustomize:
        # The chart appends planeVersion to each app image, so the digest
        # can only be attached after rendering.
        images:
          - name: artifacts.plane.so/makeplane/plane-frontend
            newTag: "v1.4.2@sha256:22fd2434fb8d6658439f669ab72f999ce0773abe587663da21a77d70bd63ff61"
          - name: artifacts.plane.so/makeplane/plane-admin
            newTag: "v1.4.2@sha256:6e1bb1d800d3c7ce84a09f810d5588db8613b35d4464e722a1bec12556ca0ebb"
          - name: artifacts.plane.so/makeplane/plane-space
            newTag: "v1.4.2@sha256:f8f842f05f41a16e9fe8c4f5e17a3bb175338ccdc094620e58ae49764ffbd671"
          - name: artifacts.plane.so/makeplane/plane-live
            newTag: "v1.4.2@sha256:cbb630ccaea24bb9998040cb45c11619a7501e8b6c75d449df2f8fd9b9cddbd0"
          - name: artifacts.plane.so/makeplane/plane-backend
            newTag: "v1.4.2@sha256:90032ce088708889b60c00d491897916f4deb882facda27db59fd10fb68729ef"
        patches:
          # Nothing here calls the Kubernetes API.
          - target:
              kind: ServiceAccount
            patch: |
              - op: add
                path: /automountServiceAccountToken
                value: false
          # Every workload has one container. The node, python and object
          # store images run as any uid, so 1000 is the default the
          # datastore and nginx patches below override.
          - target:
              kind: (Deployment|StatefulSet|Job)
            patch: |
              - op: add
                path: /spec/template/spec/securityContext
                value:
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  fsGroup: 1000
                  fsGroupChangePolicy: OnRootMismatch
                  seccompProfile:
                    type: RuntimeDefault
              - op: add
                path: /spec/template/spec/containers/0/securityContext
                value:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
          # The datastores run as the user each image ships, which owns
          # the paths its entrypoint writes outside the volume.
          - target:
              kind: StatefulSet
              name: plane-pgdb-wl
            patch: |
              - op: replace
                path: /spec/template/spec/securityContext/runAsUser
                value: 70
              - op: replace
                path: /spec/template/spec/securityContext/runAsGroup
                value: 70
              - op: replace
                path: /spec/template/spec/securityContext/fsGroup
                value: 70
          - target:
              kind: StatefulSet
              name: plane-redis-wl
            patch: |
              - op: replace
                path: /spec/template/spec/securityContext/runAsUser
                value: 999
          - target:
              kind: StatefulSet
              name: plane-rabbitmq-wl
            patch: |
              - op: replace
                path: /spec/template/spec/securityContext/runAsUser
                value: 100
              - op: replace
                path: /spec/template/spec/securityContext/runAsGroup
                value: 101
              - op: replace
                path: /spec/template/spec/securityContext/fsGroup
                value: 101
          # nginx writes its pid to /run and its temp files under
          # /var/cache/nginx, both root-owned in the image.
          - target:
              kind: Deployment
              name: plane-(web|admin)-wl
            patch: |
              - op: replace
                path: /spec/template/spec/securityContext/runAsUser
                value: 101
              - op: replace
                path: /spec/template/spec/securityContext/runAsGroup
                value: 101
              - op: replace
                path: /spec/template/spec/securityContext/fsGroup
                value: 101
              - op: add
                path: /spec/template/spec/volumes
                value:
                  - name: nginx-cache
                    emptyDir: {}
                  - name: nginx-run
                    emptyDir: {}
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts
                value:
                  - name: nginx-cache
                    mountPath: /var/cache/nginx
                  - name: nginx-run
                    mountPath: /run
          # The chart's bucket job opens the bucket to anonymous listing
          # and reads, and the route serves its path. The api creates the
          # bucket private on every start, so the job goes.
          - target:
              kind: Job
              name: plane-minio-bucket-.*
            patch: |
              $patch: delete
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: plane-minio-bucket
          # The chart gives the datastores no requests, which would make
          # them the first pods evicted when a node runs short of memory.
          - target:
              kind: StatefulSet
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: 50m
                    memory: 128Mi
          # Each upgrade adds a migrator job named for its revision, and
          # finished ones would otherwise stay in the namespace for good.
          - target:
              kind: Job
              name: plane-api-migrate-.*
            patch: |
              - op: add
                path: /spec/ttlSecondsAfterFinished
                value: 86400
