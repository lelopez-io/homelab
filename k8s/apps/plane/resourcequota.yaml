---
# 11 pods, 625m and 1182Mi requested with the datastores sized; the 7
# deployments surge one pod each (350m, 350Mi) and a migrator job adds 100m
# and 256Mi: 1075m and 1788Mi at the peak. Requests and pods only.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: plane
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: 2Gi
    pods: "24"
