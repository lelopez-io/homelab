---
# Requests and pods only: the datastores set no limit. The deployments surge
# one pod each on a rollout, and a migrator job runs beside them.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: plane
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: 2Gi
    pods: "24"
