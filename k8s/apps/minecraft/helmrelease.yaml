---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: minecraft
  namespace: minecraft
spec:
  interval: 24h
  url: https://itzg.github.io/minecraft-server-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
  namespace: minecraft
spec:
  interval: 30m
  # A world load can outlast Flux's 5m default, and an upgrade rolled
  # back mid-restart is worse than a slow one.
  timeout: 10m
  chart:
    spec:
      chart: minecraft
      version: "5.4.0"
      sourceRef:
        kind: HelmRepository
        name: minecraft
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      tag: "java25@sha256:5090768ce0331ecaefaf3cf7c1d5ea5a637ba599b14efc4fd1bf28791b5bf6fd"

    minecraftServer:
      eula: "TRUE"
      version: "26.3"
      type: "PAPER"
      difficulty: normal
      motd: "Experience is merely the name men gave to their mistakes."
      maxPlayers: 10
      gameMode: survival
      pvp: false
      onlineMode: true
      memory: 4096M
      viewDistance: 32
      enableCommandBlock: true
      # ClusterIP: WAN players arrive via the frp lanes (frpc targets the
      # cluster DNS name), LAN players via the home gateway's game routes
      # (minecraft.lan, bedrock.lan). No per-service MetalLB IPs.
      serviceType: ClusterIP
      rcon:
        enabled: true
        # The password ships as a sops Secret in this folder, applied
        # before this value lands; the chart reads it instead of
        # generating one.
        existingSecret: minecraft-rcon-password
      extraPorts:
        - name: bedrock
          containerPort: 19132
          protocol: UDP
          service:
            enabled: true
            type: ClusterIP
            port: 19132
    extraVolumes:
      - volumeMounts:
          - name: patches
            mountPath: /patches
            readOnly: true
        volumes:
          - name: patches
            configMap:
              name: minecraft-patches
      # Gateway-only volumes: no volumeMounts here, so the server
      # container never sees them; the sidecar entry mounts its own.
      - volumes:
          - name: gateway-code
            configMap:
              name: console-gateway-code
      - volumes:
          - name: gateway-rcon
            secret:
              secretName: minecraft-rcon-password
              items:
                - key: rcon-password
                  path: rcon-password
      - volumes:
          - name: gateway-auth
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3600
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - key: ca.crt
                        path: ca.crt
    sidecarContainers:
      - name: console-gateway
        image: itzg/minecraft-server:java25@sha256:5090768ce0331ecaefaf3cf7c1d5ea5a637ba599b14efc4fd1bf28791b5bf6fd
        command: ["python3", "/gateway/gateway.py"]
        env:
          - name: LOG
            value: /logs/latest.log
          - name: RCON
            value: 127.0.0.1:25575
          - name: PORT
            value: "25580"
          - name: PREFIX
            value: "!"
          - name: AUDIENCE
            value: minecraft-console
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
          - name: gateway-code
            mountPath: /gateway
            readOnly: true
          - name: datadir
            mountPath: /logs
            subPath: logs
            readOnly: true
          - name: gateway-rcon
            mountPath: /secrets/rcon
            readOnly: true
          - name: gateway-auth
            mountPath: /var/run/secrets/gateway
            readOnly: true
    # The pod's own account, and no automounted token: the gateway's
    # token and CA arrive through the projected volume alone.
    extraPodSpec:
      serviceAccountName: minecraft
      automountServiceAccountToken: "false"
    persistence:
      dataDir:
        enabled: true
        existingClaim: minecraft-data-encrypted
    resources:
      requests:
        memory: 4Gi
        cpu: 2000m
      limits:
        memory: 6Gi
        cpu: 4000m
    extraEnv:
      # Paper's recommended flags for 26.3, from its version API.
      JVM_XX_OPTS: "-XX:+UseCompactObjectHeaders -XX:+AlwaysPreTouch -XX:+DisableExplicitGC -XX:+PerfDisableSharedMem -XX:+UnlockExperimentalVMOptions -XX:+UseG1GC -XX:G1HeapRegionSize=8M -XX:G1MaxNewSizePercent=40 -XX:G1MixedGCCountTarget=4 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1NewSizePercent=30 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:G1ReservePercent=20 -XX:InitiatingHeapOccupancyPercent=15 -XX:MaxTenuringThreshold=1 -XX:SurvivorRatio=32"
      MODPACK: "https://download.bentobox.world/api/generate?downloads=%5B%22BSkyBlock%22%2C%22Challenges%22%2C%22Level%22%2C%22Warps%22%2C%22ControlPanel%22%2C%22DimensionalTrees%22%2C%22Biomes%22%2C%22Bank%22%5D"
      MODRINTH_PROJECTS: |
        paper:viaversion
      # DirectionHUD has no Paper build for 26.3 yet; this is its newest. It
      # needs OtterLib, which it no longer bundles.
      PLUGINS: |
        https://cdn.modrinth.com/data/zVVpzurY/versions/oxZLx3yz/otterlib-0.4.0.1%2B26.2-paper.jar
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
        https://cdn.modrinth.com/data/H8WCXRtb/versions/u876aZ5C/directionhud-paper-1.8.4.0%2B26.2.jar
        https://cdn.modrinth.com/data/4IIKQyBu/versions/sOt4db5s/dreamdisplays-paper-1.10.10.jar
      REMOVE_OLD_MODS: 'TRUE'
      PATCH_DEFINITIONS: /patches/patches.json
