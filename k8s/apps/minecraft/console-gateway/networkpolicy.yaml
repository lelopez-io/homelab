---
# The gateway's own rules, additive with the server's policy: callers
# reach one port from namespaces labelled as console clients, and the
# TokenReview leaves for the API servers. Port 25575 stays closed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-gateway
  namespace: minecraft
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              minecraft.lan/client: "true"
      ports:
        - protocol: TCP
          port: 25580
  egress:
    # Kubernetes API for the TokenReview the gateway makes per caller,
    # reached at the control plane node IPs after kube-proxy rewrites
    # the kubernetes Service address.
    - to:
        - ipBlock:
            cidr: 192.168.10.30/32
        - ipBlock:
            cidr: 192.168.10.31/32
        - ipBlock:
            cidr: 192.168.10.32/32
      ports:
        - protocol: TCP
          port: 6443
