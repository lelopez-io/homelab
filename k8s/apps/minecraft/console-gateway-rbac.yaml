---
# The console gateway checks a caller's token with the API server. The
# role allows asking for a token review and nothing else;
# system:auth-delegator would also grant subject access reviews.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-gateway-token-review
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-gateway-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: console-gateway-token-review
subjects:
  - kind: ServiceAccount
    name: minecraft
    namespace: minecraft
