---
apiVersion: v1
kind: Namespace
metadata:
  name: minecraft
  labels:
    # Every pod here met restricted before this was enforced.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Opt-in for the Gateway named home to admit routes from this namespace.
    gateway.lan/routes: "true"

