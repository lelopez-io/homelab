---
# 1 server, 2 CPU and 8Gi requested, 4 and 12Gi limited; Recreate, so no
# overlap, a quarter more covers a resize.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: palworld
spec:
  hard:
    requests.cpu: "2500m"
    requests.memory: 10Gi
    limits.cpu: "5"
    limits.memory: 15Gi
    pods: "3"
