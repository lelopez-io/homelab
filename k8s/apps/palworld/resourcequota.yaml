---
# Limits are capped because every container sets one. Recreate never holds two
# pods, so a quarter more covers a resize.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: palworld
spec:
  hard:
    requests.cpu: "2500m"
    requests.memory: 10Gi
    limits.cpu: "5"
    limits.memory: 15Gi
    pods: "3"
