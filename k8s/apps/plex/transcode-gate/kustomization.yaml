---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The pod mounts this ConfigMap by name from Helm values, which
# kustomize does not rewrite, so a hashed name would never be found.
# The cost: a code change reaches the running container only on a pod
# restart.
configMapGenerator:
  - name: transcode-gate
    namespace: plex
    options:
      disableNameSuffixHash: true
    files:
      - transcode-gate.py
