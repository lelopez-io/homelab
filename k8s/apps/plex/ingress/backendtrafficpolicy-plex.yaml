---
# Direct-play sessions and the SSE notification stream stay open for hours,
# far past Envoy's 15s default route timeout, so it is disabled: "0s" maps
# to Envoy's route timeout of 0, which means no limit.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: plex
  namespace: plex
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: plex
  timeout:
    http:
      requestTimeout: 0s
