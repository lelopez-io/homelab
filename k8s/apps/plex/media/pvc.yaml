---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-smb-ro
  namespace: plex
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: plex-media-smb-ro
  resources:
    requests:
      storage: 4Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-smb-rw
  namespace: plex
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: plex-media-smb-rw
  resources:
    requests:
      storage: 4Ti
