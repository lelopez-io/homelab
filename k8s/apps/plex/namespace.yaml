---
apiVersion: v1
kind: Namespace
metadata:
  name: plex
  labels:
    gateway.lan/routes: "true"
    # Restricted would refuse the media server: its image starts as root and
    # drops to its own user after setting up.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
