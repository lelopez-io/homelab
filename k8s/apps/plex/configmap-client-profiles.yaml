---
apiVersion: v1
kind: ConfigMap
metadata:
  name: plex-client-profiles
  namespace: plex
data:
  Generic.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <Client name="Generic">
      <!-- Plex for Apple TV 2026.20 stalls on Dolby Vision sent as-is, so
           HEVC carrying it is transcoded; everything else is unchanged. -->
      <CodecProfiles>
        <VideoCodec name="hevc">
          <Limitations>
            <NotMatch name="video.DOVIPresent" value="1" />
            <UpperBound name="video.width" value="1920" />
          </Limitations>
        </VideoCodec>
      </CodecProfiles>
    </Client>
