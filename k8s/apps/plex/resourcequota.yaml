---
# 1 pod, 300m and 576Mi requested: the media server 250m and 512Mi, copyparty
# 50m and 64Mi. An init container peaks lower. Requests and pods only.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: plex
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 1Gi
    pods: "4"
