---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: plex
  namespace: plex
spec:
  interval: 24h
  url: https://raw.githubusercontent.com/plexinc/pms-docker/gh-pages
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: plex
spec:
  interval: 30m
  chart:
    spec:
      chart: plex-media-server
      version: "1.9.0"
      sourceRef:
        kind: HelmRepository
        name: plex
  valuesFrom:
    - kind: Secret
      name: plex-claim
      valuesKey: claim
      targetPath: extraEnv.PLEX_CLAIM
    - kind: Secret
      name: plex-claim
      # Flux injects valuesFrom through Helm strvals, where "," separates
      # assignments, so the advertise list escapes its comma as "\,".
      valuesKey: advertise-ip
      targetPath: extraEnv.ADVERTISE_IP
    - kind: ConfigMap
      name: plex-vars
      valuesKey: PLEX_IP
      targetPath: service.annotations.metallb\.universe\.tf/loadBalancerIPs
  values:
    image:
      tag: "1.43.4.10903-e5521bd8c@sha256:e0ab27395614a8e1a4fdf84c6bc60ac664915cfdde70c52d030c7728a1c48e14"

    extraEnv:
      TZ: "America/Denver"

    service:
      # Plex reads the connection peer, never a forwarded header, to decide
      # local vs remote, so any proxy in front makes every viewer remote and
      # the LAN Networks list unmatchable. Local policy keeps the peer intact.
      type: LoadBalancer
      port: 32400
      externalTrafficPolicy: Local

    pms:
      configExistingClaim: plex-config-encrypted
      podSecurityContext:
        # Volumes here are group-owned rather than user-owned, so several
        # unprivileged processes can share them. Kubernetes applies the
        # group to the volume, joins every container to it, and sets
        # setgid on directories so new files inherit it.
        fsGroup: 2000
        # The walk is skipped once the volume root already matches, which
        # keeps it off the startup path for every later restart.
        fsGroupChangePolicy: OnRootMismatch

    extraInitContainers:
      # Which networks count as local is the other half of preserving
      # the client address, and the image exposes no variable for it,
      # so it is written into the preferences file before Plex reads.
      - name: lan-networks
        image: busybox:1.38
        command:
          - sh
          - -c
          - |
            set -e
            P="/config/Library/Application Support/Plex Media Server/Preferences.xml"
            [ -f "$P" ] || exit 0
            if grep -q 'LanNetworksBandwidth=' "$P"; then
              sed -i 's#LanNetworksBandwidth="[^"]*"#LanNetworksBandwidth="192.168.0.0/16"#' "$P"
            else
              sed -i 's#/>[[:space:]]*$# LanNetworksBandwidth="192.168.0.0/16"/>#' "$P"
            fi
            grep -o 'LanNetworksBandwidth="[^"]*"' "$P"
        volumeMounts:
          - name: pms-config
            mountPath: /config

    extraVolumes:
      - name: media
        persistentVolumeClaim:
          claimName: plex-media-encrypted
      - name: dev-dri
        hostPath:
          path: /dev/dri
          type: Directory
      # Claim name predates the tool that now uses it; it holds cached
      # thumbnails rather than a database. Renaming it would mean replacing
      # the volume for no gain.
      - name: filebrowser-db
        persistentVolumeClaim:
          claimName: filebrowser-db
      # Both land in /cfg, which the entrypoint includes wholesale. The
      # accounts file is a Secret because copyparty reads the password
      # straight out of the config text; it has no way to take one from the
      # environment. Sorting puts accounts before the volume that grants to it.
      - name: copyparty-config
        projected:
          sources:
            - configMap:
                name: copyparty-config
            - secret:
                name: copyparty-accounts

    extraVolumeMounts:
      - name: media
        mountPath: /data/media
        readOnly: true
      - name: dev-dri
        mountPath: /dev/dri

    extraContainers:
      - name: copyparty
        image: copyparty/ac:1.20.24@sha256:0e276e2ca595d1b45df613573f094b789b9a8b41ff87cc55130db1ec9763c164
        # The image declares no user, so this is the only thing keeping the
        # upload path off root. Its writable directories are world-writable
        # and its port is unprivileged, so nothing else is needed.
        securityContext:
          runAsUser: 1000
        # No arguments: the entrypoint includes every .conf under /cfg.
        env:
          # The image points this at /cfg, which is read-only here. Left
          # alone copyparty falls back to /tmp, calls it untrusted, and drops
          # sessions, putting the password in a header on every request. The
          # baked-in config includes /cfg by path, so discovery is unaffected.
          - name: XDG_CONFIG_HOME
            value: /state
        ports:
          - containerPort: 3923
        # Every route requires an account, so there is no unauthenticated
        # endpoint to probe. A listening socket is the most that can be asked.
        readinessProbe:
          tcpSocket:
            port: 3923
          initialDelaySeconds: 5
        livenessProbe:
          tcpSocket:
            port: 3923
          initialDelaySeconds: 30
        volumeMounts:
          - name: media
            mountPath: /w
          - name: copyparty-config
            mountPath: /cfg
            readOnly: true
          - name: filebrowser-db
            mountPath: /state
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
