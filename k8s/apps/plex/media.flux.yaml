---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plex-media
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./k8s/apps/plex/media
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: sync
  postBuild:
    # The media share's address comes from sops, so the NAS never appears
    # in plain manifests.
    substituteFrom:
      - kind: Secret
        name: plex-media-vars
