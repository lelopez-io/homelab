---
# Envoy sets no request body limit, so git pushes and registry blob
# uploads need nothing here to stay uncapped.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
spec:
  parentRefs:
    - name: home
      namespace: envoy-gateway-system
      sectionName: https-sub
  hostnames:
    - "${FORGE_HOST}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: forgejo-http
          port: 80
