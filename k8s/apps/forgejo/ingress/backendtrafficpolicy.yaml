---
# Git pushes and registry blob uploads outlive Envoy's 15s default route
# timeout, and no fixed ceiling fits an arbitrary repository, so the
# timeout is disabled: "0s" maps to Envoy's route timeout of 0, meaning
# no limit. Git over SSH takes its own address and never reaches here.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: forgejo
  namespace: forgejo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: forgejo
  timeout:
    http:
      requestTimeout: 0s
