---
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
  labels:
    # The forge runs as a pinned non-root uid with seccomp and no
    # capabilities, so the namespace refuses anything weaker at admission.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # The gateway's private listener admits routes only from namespaces
    # carrying this, so without it the HTTPRoute is rejected as not allowed
    # by any listener while still resolving its backend.
    gateway.lan/routes: "true"
