---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary
  namespace: frp-tunnel
spec:
  parentRefs:
    - name: home
      namespace: envoy-gateway-system
      sectionName: https-via
  hostnames:
    - "canary.${VIA_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Canary proves termination at home, not a live backend. This rule
      # returns a fixed 200 via filter; a real service carries a
      # backendRef here instead.
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: canary-direct-response
