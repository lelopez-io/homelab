---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret.sops.yaml
  - deployment.yaml
  - networkpolicy.yaml
  - canary.flux.yaml
  - limitrange.yaml
  - resourcequota.yaml
# A generated name changes with the file, so the Deployment rolls whenever
# the config does; frpc reads it only at start.
configMapGenerator:
  - name: frpc-config
    namespace: frp-tunnel
    files:
      - frpc.toml
