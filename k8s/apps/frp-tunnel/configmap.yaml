---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frpc-config
  namespace: frp-tunnel
data:
  frpc.toml: |
    serverAddr = "{{ .Envs.FRP_SERVER_ADDR }}"
    serverPort = 7000

    auth.method = "token"
    auth.token = "{{ .Envs.FRP_TOKEN }}"

    # TLS on the control channel — frps has transport.tls.force = true.
    transport.tls.enable = true

    log.to = "console"
    log.level = "info"

    # Public HTTP tier — one lane for every tier hostname: the edge routes
    # by SNI without decrypting, the gateway terminates the tier wildcard
    # and fans out by hostname.
    [[proxies]]
    name = "https-tier"
    type = "tcp"
    localIP = "192.168.10.43"
    localPort = 443
    remotePort = 8443

    # Factorio — WAN players ride the tunnel (LB 34197/udp → frps → here);
    # LAN players use factorio.lan (wildcard → ingress udp-services).
    # Replaces playit.gg. Target is the cluster service, not a MetalLB IP.
    [[proxies]]
    name = "factorio"
    type = "udp"
    localIP = "factorio-factorio-server-charts.factorio.svc.cluster.local"
    localPort = 34197
    remotePort = 34197

    # Minecraft — WAN players ride the tunnel (LB 25565/tcp + 19132/udp →
    # frps → here); LAN players use minecraft.lan / bedrock.lan (wildcard →
    # the home gateway). Replaces playit.gg.
    [[proxies]]
    name = "minecraft"
    type = "tcp"
    localIP = "minecraft.minecraft.svc.cluster.local"
    localPort = 25565
    remotePort = 25565

    [[proxies]]
    name = "minecraft-bedrock"
    type = "udp"
    localIP = "minecraft-bedrock.minecraft.svc.cluster.local"
    localPort = 19132
    remotePort = 19132
