---
# Limits are capped because every container sets one. A rolling update surges
# a second pod, so the quota is twice the running total.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: frp-tunnel
spec:
  hard:
    requests.cpu: "100m"
    requests.memory: 128Mi
    limits.cpu: "300m"
    limits.memory: 384Mi
    pods: "3"
