---
apiVersion: v1
kind: Namespace
metadata:
  name: factorio
  labels:
    # The server runs as the image's non-root uid with seccomp and no
    # capabilities, so the namespace refuses anything weaker at admission.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Opt-in for the Gateway named home to admit routes from this namespace.
    gateway.lan/routes: "true"

