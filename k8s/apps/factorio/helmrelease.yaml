---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: factorio
  namespace: factorio
spec:
  interval: 24h
  url: https://sqljames.github.io/factorio-server-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: factorio
  namespace: factorio
spec:
  interval: 30m
  chart:
    spec:
      chart: factorio-server-charts
      version: "2.5.2"
      sourceRef:
        kind: HelmRepository
        name: factorio
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    # The chart has no value for this, and a Cluster policy rewrites a LAN
    # client to a flannel address whenever the announcing node is not the
    # pod's: the rcon rule's LAN sources would never match.
    - kustomize:
        patches:
          - target:
              kind: Service
              name: factorio-factorio-server-charts-rcon
            patch: |
              - op: add
                path: /spec/externalTrafficPolicy
                value: Local
    # The image entrypoint runs under set -x and would trace its exec line,
    # password included. The trace goes to /dev/null; the value still shows
    # in the process args inside the pod.
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: factorio-factorio-server-charts
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: factorio-factorio-server-charts
              spec:
                template:
                  spec:
                    containers:
                      - name: factorio-factorio-server-charts
                        command:
                          - /bin/bash
                          - -c
                          - |
                            exec 9>/dev/null
                            BASH_XTRACEFD=9 exec /docker-entrypoint.sh
  values:
    image:
      tag: "2.0.77@sha256:35237d3cb047107cecbf7a8ef6c4fab41acc65548b65526a1b15a5dd0cb670be"
      pullPolicy: IfNotPresent
    # 845 is the user the image ships, and the save volume already belongs
    # to it. The chart's names are swapped: securityContext lands on the
    # pod, podSecurityContext on every container, init ones included.
    securityContext:
      fsGroup: 845
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      runAsUser: 845
      runAsGroup: 845
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    hostNetworkEnabled: false
    # ClusterIP: WAN players arrive via the frp lane (frpc targets the
    # cluster DNS name), LAN players via the ingress udp-services map
    # (factorio.lan). No per-service MetalLB IP.
    service:
      type: ClusterIP
      port: 34197
    persistence:
      enabled: true
      dataDir:
        existingClaim: factorio-data-encrypted
    factorioServer:
      save_name: "2024.10.23--factorio--olm-space-age"
      generate_new_save: false
      load_latest_save: false
    server_settings:
      name: "Openlandmark"
      description: "Experience is merely the name men gave to their mistakes."
      visibility:
        public: false
        lan: true
      require_user_verification: true
      max_players: 0
      auto_pause: true
      only_admins_can_pause_the_game: true
    # Password comes from sops Secret factorio-rcon, never values; empty
    # password keeps the placeholder unmounted. A new value reaches the
    # server only after a pod restart: the init container copies it at start.
    rcon:
      password: ""
      passwordSecret: factorio-rcon
    map_gen_settings:
      seed: 1853500214
    admin_list:
      - lelopez
    resources:
      requests:
        memory: 2Gi
        cpu: 1000m
      limits:
        memory: 4Gi
        cpu: 2000m
