---
# Limits are capped because every container sets one. A rolling update surges
# a second pod, so the quota is twice the running total.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: forgejo-runner
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1536Mi
    limits.cpu: "6"
    limits.memory: 10Gi
    pods: "3"
