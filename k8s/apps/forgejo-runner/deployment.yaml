---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  replicas: 1
  # The new pod must be Ready before the old one stops, so a daemon that
  # fails to start leaves the previous runner serving.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      # Every container runs in a user namespace on the node: container root
      # maps to an unprivileged host uid. The daemon's unmasked /proc is
      # admissible only with this set.
      hostUsers: false
      containers:
        # No registration step: the daemon presents the identity from its
        # config and announces its labels on every start, so there is nothing
        # to pre-create and nothing to keep between restarts.
        - name: runner
          image: code.forgejo.org/forgejo/runner:13.2.0@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552
          command:
            - forgejo-runner
            - --config
            - /etc/runner/config.yml
            - daemon
          workingDir: /data
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2376
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_TLS_VERIFY
              value: "1"
            # Go on Linux reads this in place of the image's own roots.
            - name: SSL_CERT_FILE
              value: /etc/ssl/ca-bundle/ca-certificates.crt
          volumeMounts:
            - name: ca-bundle
              mountPath: /etc/ssl/ca-bundle
              readOnly: true
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/runner
              readOnly: true
            - name: token
              mountPath: /etc/runner-token
              readOnly: true
            - name: docker-certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        # Workflow steps execute against this daemon, so nothing a workflow
        # builds or runs touches the node's container runtime.
        - name: dind
          image: docker.io/library/docker:29.9.2-dind-rootless@sha256:ae083cc7de51e7a8e5a597f8fb774ca7914c408a95fc0f1477826a913479518a
          # Rootless: the daemon runs as uid 1000 in its own user namespace.
          # A job given it, even with --privileged, holds capabilities only
          # inside that namespace; node devices and paths never map in.
          args:
            # The emptyDir is world-writable, so uid 1000 creates the
            # directory itself and nothing needs to chown it.
            - --data-root=/dind/data
            - --mtu=65520
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
            # Userspace networking terminates TCP in the daemon's stack, so
            # the overlay's MTU never reaches job containers; 65520 cuts
            # per-segment overhead on image pushes through it.
            - name: DOCKERD_ROOTLESS_ROOTLESSKIT_MTU
              value: "65520"
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: dind-storage
              mountPath: /dind
            # The image's ranges start at 100000, past the pod's mapping.
            - name: dind-subid
              mountPath: /etc/subuid
              subPath: subuid
              readOnly: true
            - name: dind-subid
              mountPath: /etc/subgid
              subPath: subgid
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
              # The userspace network's tun device comes as a grant from the
              # node device plugin, so no capability here may create one.
              devic.es/tun: 1
          # Ready only once the daemon answers over TLS, so a daemon that
          # fails to start stalls the rollout instead of failing every job.
          readinessProbe:
            exec:
              command:
                - docker
                - --host=tcp://localhost:2376
                - --tlsverify
                - --tlscacert=/certs/client/ca.pem
                - --tlscert=/certs/client/cert.pem
                - --tlskey=/certs/client/key.pem
                - version
            periodSeconds: 10
            timeoutSeconds: 5
          # Seccomp and /proc settings: see namespace.yaml. newuidmap's file
          # capabilities need SETUID and SETGID bounded in and no_new_privs
          # unset, so allowPrivilegeEscalation is not false.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            procMount: Unmasked
            seccompProfile:
              type: Unconfined
            capabilities:
              drop:
                - ALL
              add:
                - SETUID
                - SETGID
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: token
          secret:
            secretName: forgejo-runner-token
        - name: docker-certs
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
        - name: dind-subid
          configMap:
            name: dind-subid
        - name: ca-bundle
          configMap:
            name: ca-bundle
