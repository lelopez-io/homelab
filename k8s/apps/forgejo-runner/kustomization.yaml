---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret-token.sops.yaml
  - configmap.yaml
  - deployment.yaml
  - networkpolicy.yaml
  - secret-grant-vars.sops.yaml
  - grant.flux.yaml
  - limitrange.yaml
  - resourcequota.yaml
# Mozilla's 2026-10-20 roots, without the two the compromised eMudhra
# intermediates chain to. The runner clones actions on a Go that predates the
# x509 fix; remove once it ships on Go 1.26.10 or later.
configMapGenerator:
  - name: ca-bundle
    namespace: forgejo-runner
    files:
      - ca-certificates.crt=ca-bundle.pem
  # Ids 1..65535 of the pod's mapping; newuidmap refuses any range outside
  # it. rootlesskit removes the daemon's own 1000 from the range, so the map
  # inside covers 0..65534.
  - name: dind-subid
    namespace: forgejo-runner
    literals:
      - subuid=rootless:1:65535
      - subgid=rootless:1:65535
