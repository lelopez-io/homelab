# Judged by no-token.yaml: the decisions its Deny action would make.
- name: "mutated pod: automount false, no token volume"
  want: admit
  resource: pods
  labels: {"forge/repository": "site"}
  object: {"spec":{"automountServiceAccountToken":false,"containers":[],"volumes":[{"name":"tmp","emptyDir":{}}]}}
- name: "unmutated pod: token volume injected"
  want: deny
  resource: pods
  labels: {"forge/repository": "site"}
  object: {"spec":{"containers":[],"volumes":[{"name":"kube-api-access-x","projected":{"sources":[{"serviceAccountToken":{"path":"token","expirationSeconds":3607}}]}}]}}
- name: "pod that leaves automount unset, as when the mutation is down"
  want: deny
  resource: pods
  labels: {"forge/repository": "site"}
  object: {"spec":{"containers":[]}}
- name: "pod that sets automount true"
  want: deny
  resource: pods
  labels: {"forge/repository": "site"}
  object: {"spec":{"automountServiceAccountToken":true,"containers":[],"volumes":[{"name":"kube-api-access-x","projected":{"sources":[{"serviceAccountToken":{"path":"token","expirationSeconds":3607}}]}}]}}
- name: "automount false but a projected token volume"
  want: deny
  resource: pods
  labels: {"forge/repository": "site"}
  object: {"spec":{"automountServiceAccountToken":false,"containers":[],"volumes":[{"name":"kube-api-access-x","projected":{"sources":[{"serviceAccountToken":{"path":"token","expirationSeconds":3607}}]}}]}}
- name: "automount false with a projected configMap"
  want: admit
  resource: pods
  labels: {"forge/repository": "site"}
  object: {"spec":{"automountServiceAccountToken":false,"containers":[],"volumes":[{"name":"c","projected":{"sources":[{"configMap":{"name":"x"}}]}}]}}
- name: "pod created by a controller, not the forge identity"
  want: deny
  resource: pods
  as: system:serviceaccount:kube-system:replicaset-controller
  labels: {"forge/repository": "site"}
  object: {"spec":{"containers":[]}}
- name: "pod in a namespace no run owns is not judged"
  want: admit
  resource: pods
  as: system:serviceaccount:kube-system:replicaset-controller
  labels: {}
  object: {"spec":{"containers":[],"volumes":[{"name":"kube-api-access-x","projected":{"sources":[{"serviceAccountToken":{"path":"token","expirationSeconds":3607}}]}}]}}
