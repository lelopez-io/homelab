# Each case is judged by the forge-run-ceilings policy as the API server
# would; run.sh evaluates them. The registry host is a stand-in.
- name: "site deploy as shipped today"
  want: admit
  resource: deployments
  object: {"spec":{"template":{"spec":{"containers":[{"name":"c","image":"registry.test/owner/site@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","resources":{"limits":{"cpu":"200m","memory":"64Mi"}}}]}}}}
- name: "a forge app's cronjob without a token setting"
  want: admit
  resource: cronjobs
  object: {"spec":{"jobTemplate":{"spec":{"template":{"spec":{"containers":[{"name":"c","image":"registry.test/owner/site@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","resources":{"limits":{"cpu":"500m","memory":"128Mi"},"requests":{"cpu":"10m","memory":"32Mi"}}}]}}}}}}
- name: "tag and digest together"
  want: admit
  resource: deployments
  object: {"spec":{"template":{"spec":{"containers":[{"name":"c","image":"registry.test/owner/site:1.2@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","resources":{"limits":{"cpu":"200m","memory":"64Mi"}}}]}}}}
- name: "image by tag only"
  want: deny
  resource: deployments
  object: {"spec":{"template":{"spec":{"containers":[{"name":"c","image":"registry.test/owner/site:1.2","resources":{"limits":{"cpu":"200m","memory":"64Mi"}}}]}}}}
- name: "image without tag or digest"
  want: deny
  resource: deployments
  object: {"spec":{"template":{"spec":{"containers":[{"name":"c","image":"registry.test/owner/site","resources":{"limits":{"cpu":"200m","memory":"64Mi"}}}]}}}}
