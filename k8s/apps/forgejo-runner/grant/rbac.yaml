---
# Bound to the group every forge run carries; talos/talconfig.yaml is where
# the group is set and runs are limited to tags. No RBAC kinds, so a run
# cannot widen its own grant, and policy.yaml decides its namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forge-runs
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "serviceaccounts", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read-only on pods and events, so a run can see why its own job failed.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forge-runs
subjects:
  - kind: Group
    name: forge:${FORGE_OWNER}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: forge-runs
  apiGroup: rbac.authorization.k8s.io
