apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
- gpg-public-keys.yaml
# Mozilla's 2026-10-20 roots, without the two the compromised eMudhra
# intermediates chain to. source-controller's Go predates the x509 fix;
# remove once Flux ships on Go 1.26.10 or later.
configMapGenerator:
- name: ca-bundle
  namespace: flux-system
  files:
  - ca-certificates.crt=ca-bundle.pem
# The bootstrap manifests ship the controllers by tag. A Flux upgrade
# regenerates gotk-components.yaml and must update every entry here with it.
# Steps in k8s/core/pinned-images.md.
images:
- name: ghcr.io/fluxcd/source-controller
  newTag: v1.7.4@sha256:16f21ac1795528df80ddef51ccbb14a57b78ea26e66dc8551636ef9a3cec71b3
- name: ghcr.io/fluxcd/kustomize-controller
  newTag: v1.7.3@sha256:e8ca82d66dafdd8ef77e0917f4adec53478075130ac61264dc0f91eb0f8cb6ce
- name: ghcr.io/fluxcd/helm-controller
  newTag: v1.4.5@sha256:d8d8fc2fb46c554e28071f1e4879be33491e71fdd3e0e41f61bb494a72c6dffc
- name: ghcr.io/fluxcd/notification-controller
  newTag: v1.7.5@sha256:ba723a55f7c7c7feedd50bb5db0ff2dd9a3b0ae85b50f61a0457184025b38c54
patches:
  # Every controller runs non-root with the default seccomp profile and
  # no capabilities, so the namespace enforces what its pods already
  # meet. The bootstrap owns the object, so the labels land as a patch.
  - target:
      kind: Namespace
      name: flux-system
    patch: |
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1enforce
        value: restricted
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1audit
        value: restricted
  # Deploy from signed release tags, not branch HEAD: commits (agent or
  # human) flow freely to main and never deploy; only a deliberate,
  # presence-gated `git tag -s` changes the cluster. A compromised GitHub
  # account can push code but cannot cut a signed release.
  # New tags sort above the old unsigned article tags, so those are never
  # candidates once the first release exists (cut it before this config
  # reconciles). The JSON patch replaces ref wholesale (branch and semver
  # are mutually exclusive); gotk-sync.yaml stays bootstrap-owned.
  - target:
      kind: GitRepository
      name: flux-system
    patch: |
      - op: replace
        path: /spec/ref
        value:
          semver: "*"
      - op: add
        path: /spec/verify
        value:
          mode: Tag
          secretRef:
            name: gpg-public-keys
  # No scraper and no Receiver exists, so neither policy has a caller
  # outside flux-system and allow-egress already covers same-namespace
  # traffic. A future scraper or Receiver adds its caller rule with it.
  - target:
      kind: NetworkPolicy
      name: allow-scraping
    patch: |
      - op: replace
        path: /spec/ingress
        value: []
  - target:
      kind: NetworkPolicy
      name: allow-webhooks
    patch: |
      - op: replace
        path: /spec/ingress
        value: []
  # Go on Linux reads SSL_CERT_FILE in place of the image's own roots.
  - target:
      kind: Deployment
      name: source-controller
    patch: |
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: ca-bundle
          configMap:
            name: ca-bundle
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: ca-bundle
          mountPath: /etc/ssl/ca-bundle
          readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SSL_CERT_FILE
          value: /etc/ssl/ca-bundle/ca-certificates.crt
