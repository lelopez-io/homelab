---
clusterName: homelab-cluster
talosVersion: v1.13.12
kubernetesVersion: v1.34.1
endpoint: https://192.168.10.30:6443
allowSchedulingOnControlPlanes: true

clusterPodNets:
  - 10.244.0.0/16
clusterSvcNets:
  - 10.96.0.0/12

cniConfig:
  name: flannel

cluster:
  etcd:
    advertisedSubnets:
      - 192.168.10.0/24

controlPlane:
  patches:
    - |-
      cluster:
        apiServer:
          extraArgs:
            feature-gates: DynamicResourceAllocation=true
            runtime-config: resource.k8s.io/v1=true
            # The forge issues OIDC tokens to its own Actions runs, so a forge
            # repository reaches the API server with no stored credential. The
            # file is the only authenticator source: the API server refuses to
            # start with both it and any oidc-* flag.
            authentication-config: /etc/kubernetes/authn/authentication-config.yaml
          extraVolumes:
            - hostPath: /var/lib/kube-apiserver-authn
              mountPath: /etc/kubernetes/authn
              readonly: true
        controllerManager:
          extraArgs:
            feature-gates: DynamicResourceAllocation=true
        scheduler:
          extraArgs:
            feature-gates: DynamicResourceAllocation=true
    # Talos writes machine files in the boot sequence only, so a change here
    # reaches the node on a reboot, never on a live apply.
    - |-
      machine:
        files:
          - path: /var/lib/kube-apiserver-authn/authentication-config.yaml
            op: create
            permissions: 0o644
            content: |
              apiVersion: apiserver.config.k8s.io/v1
              kind: AuthenticationConfiguration
              jwt:
                - issuer:
                    url: ${FORGE_ROOT}/api/actions
                    audiences:
                      - ${FORGE_ROOT}/${FORGE_OWNER}
                      # A colon cannot occur in an owner name, so the default
                      # matches nothing until FORGE_OWNER_2 is set.
                      - "${FORGE_ROOT}/${FORGE_OWNER_2:-unset:}"
                    audienceMatchPolicy: MatchAny
                  # The repository in sub is what the admission policy keys
                  # namespaces on.
                  claimMappings:
                    username:
                      claim: sub
                      prefix: "forge:"
                    # One group for every run of the owner's repositories, so
                    # one ClusterRoleBinding in k8s/apps/forgejo-runner covers
                    # them all.
                    groups:
                      claim: repository_owner
                      prefix: "forge:"
                  # Tags gate anything public or production. The second owner's
                  # dev branch is the one exception, for its development site, and
                  # only from a push: pull_request_target also carries the base ref.
                  claimValidationRules:
                    - expression: >-
                        claims.ref_type == 'tag' ||
                        (claims.repository_owner == '${FORGE_OWNER_2:-unset:}' &&
                        claims.ref == 'refs/heads/dev' &&
                        claims.event_name == 'push')
                      message: forge runs authenticate from a tag or the dev branch of the second owner


nodes:
  - hostname: talos-node-1
    ipAddress: 192.168.10.30
    controlPlane: true
    machineSpec:
      secureboot: true
    installDiskSelector:
      size: ">= 2TB"
      model: WPBSN4M8-2TGP
    networkInterfaces:
      - interface: enp172s0
        addresses:
          - 192.168.10.30/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.10.1
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/i915         # Intel GPU drivers
            - siderolabs/intel-ucode  # Intel CPU microcode
            - siderolabs/iscsi-tools  # iSCSI storage drivers
    volumes:
      - name: STATE
        encryption:
          provider: luks2
          keys:
            - slot: 0
              tpm: {}
      - name: EPHEMERAL
        encryption:
          provider: luks2
          keys:
            - slot: 0
              tpm: {}
    patches:
      - |-
        machine:
          kubelet:
            extraArgs:
              feature-gates: DynamicResourceAllocation=true
          files:
            - path: /etc/cri/conf.d/20-customization.part
              op: create
              content: |
                [plugins."io.containerd.cri.v1.runtime"]
                  cdi_spec_dirs = ["/var/run/cdi"]

